name: Build Linux x64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
          rustup update stable --no-self-update
      - name: Build
        run: cargo +stable build --release --features eframe/x11,eframe/wayland
      - name: Package Linux executable
        run: |
          file target/release/test-frontend-vpinballx
          tar -czf test-frontend-vpinballx-linux-x64.tar.gz -C target/release test-frontend-vpinballx
      - uses: actions/upload-artifact@v4
        with:
          name: test-frontend-vpinballx-linux-x64
          path: test-frontend-vpinballx-linux-x64.tar.gz
          if-no-files-found: error
